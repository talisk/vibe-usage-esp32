name: Bug report
description: Report a reproducible non-sensitive defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, Wi-Fi passwords, personal Usage responses, cardid data, or unredacted logs.
  - type: dropdown
    id: board
    attributes:
      label: Board
      options:
        - FoloToy AI Passport
        - ZECTRIX NOTE4 BLACK-WHITE 400x300
        - Host/build only
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or source revision
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include image SHA-256 and evidence category; redact all private values.
